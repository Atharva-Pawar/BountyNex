<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <script>
      (function() {
        var t = localStorage.getItem('bountynx-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BountyNex - a decentralized bug bounty platform connecting organizations with security researchers."
    />
    <title>BountyNex - Decentralized Bug Bounty Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
